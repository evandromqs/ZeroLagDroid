<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #111b21;
      color: #e9edef;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #00a884;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #8696a0;
      margin-bottom: 4px;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #202c33;
      border: 1px solid rgba(134, 150, 160, 0.15);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #00a884;
    }
    button {
      width: 100%;
      background: #00a884;
      color: #111b21;
      font-weight: 800;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 4px;
      transition: all 0.2s;
    }
    button:hover {
      background: #06cf9c;
    }
    .btn-secondary {
      background: #202c33;
      color: #e9edef;
      border: 1px solid rgba(134, 150, 160, 0.15);
      font-weight: 600;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #2a3942;
      color: #00a884;
      border-color: #00a884;
    }
    .status {
      font-size: 11px;
      color: #00a884;
      text-align: center;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <h3>🚀 ZeroLagDroid Config</h3>
  
  <div class="field">
    <label>Sua Chave Pix:</label>
    <input type="text" id="pixKey" placeholder="Ex: Telefone, CPF ou E-mail">
  </div>

  <div class="field">
    <label>Seu Nome (para confirmação do Pix):</label>
    <input type="text" id="userName" placeholder="Ex: Evandro Marques">
  </div>

  <button id="saveBtn">Salvar Dados</button>
  <button id="openOptionsBtn" class="btn-secondary">⚙️ Abrir Central de Ajustes Completa</button>
  <div id="status" class="status">✅ Dados salvos com sucesso!</div>

  <script src="popup.js"></script>
</body>
</html>

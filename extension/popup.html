<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #00e676;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 4px;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #00e676;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
      color: #0d1117;
      font-weight: 800;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 4px;
    }
    button:hover {
      opacity: 0.9;
    }
    .status {
      font-size: 11px;
      color: #00e676;
      text-align: center;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <h3>🚀 ZeroLagDroid Config</h3>
  
  <div class="field">
    <label>Sua Chave Pix:</label>
    <input type="text" id="pixKey" placeholder="Ex: CPF, Telefone ou E-mail">
  </div>

  <div class="field">
    <label>Seu Nome (para confirmação do Pix):</label>
    <input type="text" id="userName" placeholder="Ex: Evandro Marques">
  </div>

  <button id="saveBtn">Salvar Dados</button>
  <div id="status" class="status">✅ Dados salvos com sucesso!</div>

  <script src="popup.js"></script>
</body>
</html>
